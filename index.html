<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBuddy Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 StudyBuddy</h1>

        <button id="themeBtn">🌙 Dark Mode</button>
    </header>

    <main>

        <section class="welcome">
            <h2>Welcome Back, Student! 👋</h2>
            <p>Small steps every day lead to big results.</p>
        </section>

        <section class="stats">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="card">
                <h3>Progress</h3>
                <p id="progress">0%</p>
            </div>

        </section>

        <section class="task-section">

            <h2>Today's Tasks ✅</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    required
                >

                <button type="submit">Add Task +</button>
            </form>

            <ul id="taskList"></ul>

        </section>

        <section class="timer-section">

            <h2>Pomodoro Study Timer ⏱️</h2>

            <div id="timer">25:00</div>

            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>

        </section>

    </main>

    <footer>
        <p>Made with ❤️ for productive students</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
